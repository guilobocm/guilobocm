<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;family=Inter:wght@500;600;700;800&amp;display=swap');
      
      .bg { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; rx: 12; }
      
      .text-primary { font-family: 'Inter', sans-serif; fill: #1E293B; }
      .text-secondary { font-family: 'Inter', sans-serif; fill: #64748B; }
      .text-code { font-family: 'JetBrains Mono', monospace; fill: #475569; }
      
      .accent-teal { fill: #0F766E; }
      .accent-gold { fill: #D97706; }
      
      .panel { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 2; rx: 8; }
      
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0B1120; stroke: #1E293B; }
        .text-primary { fill: #F8FAFC; }
        .text-secondary { fill: #94A3B8; }
        .text-code { fill: #CBD5E1; }
        .accent-teal { fill: #14B8A6; }
        .accent-gold { fill: #F59E0B; }
        .panel { fill: #0F172A; stroke: #1E293B; }
      }
    </style>
  </defs>

  <!-- Plate Background -->
  <rect x="2" y="2" width="796" height="446" class="bg" />

  <!-- Global Header -->
  <text x="40" y="60" class="text-secondary" font-size="20" font-weight="700" letter-spacing="3">DIXON-COLES + SCORING-RULE OPTIMISATION</text>

  <!-- Left Column: Optimal Pick -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="340" height="180" class="panel" />
    <text x="30" y="55" class="text-secondary" font-size="22" font-weight="700" letter-spacing="2">OPTIMAL SCORE PICK</text>
    <text x="30" y="105" class="text-primary" font-size="30" font-weight="800">Spain 1–1 Germany</text>
    <rect x="30" y="130" width="280" height="4" class="accent-gold" rx="2" />
    <text x="30" y="160" class="text-secondary" font-size="16" font-weight="600" letter-spacing="1">MAX EXPECTED POOL POINTS</text>
    <text x="30" y="172" class="text-secondary" font-size="10" font-weight="500" letter-spacing="0" opacity="0.6">* ILLUSTRATIVE DECISION OUTPUT</text>
  </g>

  <!-- Right Column: Probabilities -->
  <g transform="translate(420, 100)">
    <rect x="0" y="0" width="340" height="180" class="panel" />
    <text x="30" y="55" class="text-secondary" font-size="22" font-weight="700" letter-spacing="2">OUTCOME PROBABILITIES</text>
    
    <!-- Bars -->
    <g font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700">
      <!-- Home -->
      <text x="30" y="95" class="text-primary">HOME</text>
      <rect x="110" y="78" width="130" height="20" class="accent-teal" rx="4" />
      <text x="250" y="95" class="text-primary">38.4%</text>
      
      <!-- Draw -->
      <text x="30" y="130" class="text-primary">DRAW</text>
      <rect x="110" y="113" width="105" height="20" class="accent-teal" rx="4" opacity="0.7" />
      <text x="250" y="130" class="text-primary">31.2%</text>
      
      <!-- Away -->
      <text x="30" y="165" class="text-primary">AWAY</text>
      <rect x="110" y="148" width="102" height="20" class="accent-teal" rx="4" opacity="0.4" />
      <text x="250" y="165" class="text-primary">30.4%</text>
    </g>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(40, 310)">
    <rect x="0" y="0" width="720" height="100" class="panel" stroke-width="2" />
    
    <g transform="translate(40, 58)">
      <text x="0" y="0" class="text-secondary" font-size="28" font-weight="700" letter-spacing="2">100,000 SIMULATIONS</text>
      
      <text x="400" y="-18" class="text-secondary" font-size="16" font-weight="700" letter-spacing="1">DIRECTIONAL UPLIFT</text>
      <text x="400" y="2" class="text-secondary" font-size="16" font-weight="700" letter-spacing="1">VS MODAL PICKS</text>
      
      <text x="400" y="42" class="accent-gold" font-size="38" font-weight="800" letter-spacing="0">+10 PTS</text>
    </g>
  </g>

</svg>
