<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <style>
      
      
      .bg { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; rx: 12; }
      
      .text-primary { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1E293B; }
      .text-secondary { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; fill: #475569; }
      
      .accent-teal { fill: #0F766E; }
      .accent-gold { fill: #D97706; }
      
      .stroke-slate { stroke: #CBD5E1; stroke-width: 3; fill: none; }
      .stroke-teal { stroke: #0F766E; stroke-width: 4; fill: none; }
      
      .panel { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 2; rx: 8; }
      
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0B1120; stroke: #1E293B; }
        .text-primary { fill: #F8FAFC; }
        .text-secondary { fill: #94A3B8; }
        .text-code { fill: #CBD5E1; }
        .accent-teal { fill: #14B8A6; }
        .accent-gold { fill: #F59E0B; }
        .stroke-slate { stroke: #475569; }
        .stroke-teal { stroke: #14B8A6; }
        .panel { fill: #0F172A; stroke: #1E293B; }
      }
    </style>
  </defs>

  <!-- Plate Background -->
  <rect x="2" y="2" width="796" height="446" class="bg" />

  <!-- Global Header -->
  <text x="40" y="60" class="text-secondary" font-size="20" font-weight="700" letter-spacing="3">THOMPSON SAMPLING EXPERIMENTATION</text>

  <!-- Left Column: Routing Logic -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="340" height="180" class="panel" />
    <text x="30" y="45" class="text-secondary" font-size="22" font-weight="700" letter-spacing="2">DYNAMIC ROUTING</text>
    
    <!-- Flow visual (Traffic -> Policy -> Allocation Vector) -->
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle">
      <text x="170" y="80" class="text-primary">TRAFFIC</text>
      
      <path d="M 170 90 L 170 105" stroke="#94A3B8" stroke-width="2" />
      <path d="M 165 100 L 170 105 L 175 100" fill="none" stroke="#94A3B8" stroke-width="2" />
      
      <rect x="70" y="115" width="200" height="30" class="bg" />
      <text x="170" y="136" class="text-primary">THOMPSON POLICY</text>
      
      <!-- Branching arrows -->
      <path d="M 170 145 L 170 155" stroke="#94A3B8" stroke-width="2" />
      <path d="M 170 150 L 100 150 L 100 155" fill="none" stroke="#94A3B8" stroke-width="2" />
      <path d="M 170 150 L 240 150 L 240 155" fill="none" stroke="#94A3B8" stroke-width="2" />
      
      <!-- Allocation Vector -->
      <text x="100" y="172" class="text-code">A 22%</text>
      <text x="170" y="172" class="accent-teal">B 61%</text>
      <text x="240" y="172" class="text-code">C 17%</text>
    </g>
  </g>

  <!-- Right Column: Beta Posteriors -->
  <g transform="translate(420, 100)">
    <rect x="0" y="0" width="340" height="180" class="panel" />
    <text x="30" y="45" class="text-secondary" font-size="22" font-weight="700" letter-spacing="2">BETA POSTERIORS</text>
    
    <!-- Chart Area -->
    <g transform="translate(30, 150)">
      <!-- Baseline axis -->
      <path d="M 0 0 L 280 0" stroke="#CBD5E1" stroke-width="2" />
      
      <!-- Arm A (Wide, left, uncertain) -->
      <path d="M 20 0 C 40 0, 50 -40, 80 -40 C 110 -40, 120 0, 140 0" class="stroke-slate" stroke-dasharray="4 4"/>
      <text x="65" y="-50" class="text-secondary" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700">A</text>
      
      <!-- Arm C (Medium width, middle) -->
      <path d="M 80 0 C 110 0, 125 -60, 150 -60 C 175 -60, 190 0, 220 0" class="stroke-slate" />
      <text x="145" y="-70" class="text-secondary" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700">C</text>
      
      <!-- Arm B (Narrow, right, highly confident & optimal) -->
      <path d="M 170 0 C 190 0, 210 -100, 230 -100 C 250 -100, 270 0, 290 0" class="stroke-teal" />
      <!-- Filled Area -->
      <path d="M 170 0 C 190 0, 210 -100, 230 -100 C 250 -100, 270 0, 290 0 L 290 0 Z" class="accent-teal" opacity="0.1" />
      <text x="242" y="-88" class="accent-teal" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700">B</text>
    </g>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(40, 310)">
    <rect x="0" y="0" width="720" height="100" class="panel" stroke-width="2" />
    
    <g transform="translate(40, 58)">
      <text x="0" y="-14" class="text-secondary" font-size="22" font-weight="700" letter-spacing="2">POSTGRESQL</text>
      <text x="0" y="14" class="text-secondary" font-size="22" font-weight="700" letter-spacing="2">STATE PERSISTENCE</text>
      
      <!-- Removed benchmark < 15ms. Using qualitative architecture detail instead -->
      <text x="440" y="-14" class="text-secondary" font-size="16" font-weight="700" letter-spacing="1">MULTI-VARIANT</text>
      <text x="440" y="24" class="accent-gold" font-size="38" font-weight="800" letter-spacing="0">A/B/N</text>
    </g>
  </g>

</svg>
