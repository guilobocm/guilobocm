<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;family=Inter:wght@500;600;700;800&amp;display=swap');
      
      .bg { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; rx: 12; }
      
      .text-primary { font-family: 'Inter', sans-serif; fill: #1E293B; }
      .text-secondary { font-family: 'Inter', sans-serif; fill: #64748B; }
      .text-code { font-family: 'JetBrains Mono', monospace; fill: #475569; }
      
      .accent-teal { fill: #0F766E; }
      .accent-gold { fill: #D97706; }
      
      .stroke-slate { stroke: #CBD5E1; stroke-width: 3; fill: none; }
      .stroke-teal { stroke: #0F766E; stroke-width: 4; fill: none; }
      
      .panel { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 2; rx: 8; }
      
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0B1120; stroke: #1E293B; }
        .text-primary { fill: #F8FAFC; }
        .text-secondary { fill: #94A3B8; }
        .text-code { fill: #CBD5E1; }
        .accent-teal { fill: #14B8A6; }
        .accent-gold { fill: #F59E0B; }
        .stroke-slate { stroke: #475569; }
        .stroke-teal { stroke: #14B8A6; }
        .panel { fill: #0F172A; stroke: #1E293B; }
      }
    </style>
  </defs>

  <!-- Plate Background -->
  <rect x="2" y="2" width="796" height="446" class="bg" />

  <!-- Global Header -->
  <text x="40" y="60" class="text-secondary" font-size="20" font-weight="700" letter-spacing="3">THOMPSON SAMPLING EXPERIMENTATION</text>

  <!-- Left Column: Routing Logic -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="340" height="180" class="panel" />
    <text x="30" y="55" class="text-secondary" font-size="22" font-weight="700" letter-spacing="2">DYNAMIC ROUTING</text>
    
    <!-- Flow visual -->
    <g font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700">
      <rect x="30" y="85" width="120" height="40" class="bg" />
      <text x="50" y="112" class="text-primary">REQUEST</text>
      
      <!-- Arrow -->
      <path d="M 165 105 L 195 105" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
      <path d="M 185 95 L 195 105 L 185 115" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round" />

      <rect x="210" y="85" width="100" height="40" fill="#0F766E" opacity="0.1" stroke="#0F766E" stroke-width="2" rx="4" />
      <text x="235" y="112" class="accent-teal" font-weight="800">ARM B</text>
    </g>
  </g>

  <!-- Right Column: Beta Posteriors -->
  <g transform="translate(420, 100)">
    <rect x="0" y="0" width="340" height="180" class="panel" />
    <text x="30" y="55" class="text-secondary" font-size="22" font-weight="700" letter-spacing="2">BETA POSTERIORS</text>
    
    <!-- Chart Area -->
    <g transform="translate(30, 150)">
      <!-- Baseline axis -->
      <path d="M 0 0 L 280 0" stroke="#CBD5E1" stroke-width="2" />
      
      <!-- Arm A (Wide, left, uncertain) -->
      <path d="M 20 0 C 40 0, 50 -40, 80 -40 C 110 -40, 120 0, 140 0" class="stroke-slate" stroke-dasharray="4 4"/>
      <text x="65" y="-50" class="text-secondary" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">A</text>
      
      <!-- Arm C (Medium width, middle) -->
      <path d="M 80 0 C 110 0, 125 -60, 150 -60 C 175 -60, 190 0, 220 0" class="stroke-slate" />
      <text x="145" y="-70" class="text-secondary" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">C</text>
      
      <!-- Arm B (Narrow, right, highly confident & optimal) -->
      <path d="M 170 0 C 190 0, 210 -100, 230 -100 C 250 -100, 270 0, 290 0" class="stroke-teal" />
      <!-- Filled Area -->
      <path d="M 170 0 C 190 0, 210 -100, 230 -100 C 250 -100, 270 0, 290 0 L 290 0 Z" class="accent-teal" opacity="0.1" />
      <text x="225" y="-110" class="accent-teal" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">B</text>
    </g>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(40, 310)">
    <rect x="0" y="0" width="720" height="100" class="panel" stroke-width="2" />
    
    <g transform="translate(40, 58)">
      <text x="0" y="0" class="text-secondary" font-size="28" font-weight="700" letter-spacing="2">POSTGRESQL STATE PERSISTENCE</text>
      <text x="460" y="-12" class="text-secondary" font-size="18" font-weight="700" letter-spacing="1">ALLOCATION LATENCY</text>
      <text x="460" y="24" class="accent-gold" font-size="38" font-weight="800" letter-spacing="0">&lt; 15ms</text>
    </g>
  </g>

</svg>
