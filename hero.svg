<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&amp;display=swap');
      
      .bg { fill: transparent; }
      
      .name {
        font-family: 'Inter', sans-serif;
        font-size: 36px;
        font-weight: 700;
        fill: #0F172A;
        letter-spacing: -0.5px;
      }
      
      .seal {
        font-family: 'Inter', sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #0891B2; /* Cyan seal */
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .title {
        font-family: 'Inter', sans-serif;
        font-size: 16px;
        font-weight: 500;
        fill: #0F766E; /* Deep Teal */
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      
      .subtitle {
        font-family: 'Inter', sans-serif;
        font-size: 16px;
        font-weight: 400;
        fill: #475569;
      }
      
      .flow-box {
        fill: transparent;
        stroke-width: 1;
        rx: 3;
      }
      
      .flow-box-cyan { stroke: #06B6D4; }
      .flow-box-amber { stroke: #D97706; }
      .flow-box-slate { stroke: #CBD5E1; }
      
      .flow-text {
        font-family: 'Inter', sans-serif;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 1.5px;
        text-anchor: middle;
      }
      
      .flow-text-cyan { fill: #0891B2; }
      .flow-text-amber { fill: #B45309; }
      .flow-text-slate { fill: #64748B; }
      
      .arrow {
        fill: none;
        stroke: #E2E8F0;
        stroke-width: 1;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      @media (prefers-color-scheme: dark) {
        .name { fill: #F8FAFC; }
        .seal { fill: #22D3EE; } /* Bright Cyan seal */
        .title { fill: #2DD4BF; } /* Bright Teal */
        .subtitle { fill: #94A3B8; }
        
        .flow-box-cyan { stroke: #22D3EE; }
        .flow-box-amber { stroke: #F59E0B; }
        .flow-box-slate { stroke: #475569; }
        
        .flow-text-cyan { fill: #22D3EE; }
        .flow-text-amber { fill: #FBBF24; }
        .flow-text-slate { fill: #94A3B8; }
        
        .arrow { stroke: #334155; }
      }
    </style>
  </defs>

  <rect width="800" height="300" class="bg" />

  <g transform="translate(400, 75)" text-anchor="middle">
    <text y="0" class="name">Guilherme Lôbo Calazans Machado</text>
    <text y="35" class="seal">DECISION INTELLIGENCE</text>
    <text y="60" class="title">Data Science · ML Systems · Data Engineering</text>
    <text y="95" class="subtitle">Building systems that turn data, forecasts and</text>
    <text y="119" class="subtitle">uncertainty into auditable decisions.</text>
  </g>

  <!-- Flow Diagram -->
  <g transform="translate(100, 240)">
    <!-- DATA (Cyan) -->
    <rect x="0" y="0" width="80" height="28" class="flow-box flow-box-cyan" />
    <text x="40" y="18" class="flow-text flow-text-cyan">DATA</text>
    
    <!-- Arrow -->
    <path d="M 86 14 L 114 14 M 110 11 L 114 14 L 110 17" class="arrow" />
    
    <!-- FORECAST (Neutral) -->
    <rect x="120" y="0" width="90" height="28" class="flow-box flow-box-slate" />
    <text x="165" y="18" class="flow-text flow-text-slate">FORECAST</text>

    <!-- Arrow -->
    <path d="M 216 14 L 244 14 M 240 11 L 244 14 L 240 17" class="arrow" />
    
    <!-- UNCERTAINTY (Neutral) -->
    <rect x="250" y="0" width="105" height="28" class="flow-box flow-box-slate" />
    <text x="302.5" y="18" class="flow-text flow-text-slate">UNCERTAINTY</text>

    <!-- Arrow -->
    <path d="M 361 14 L 389 14 M 385 11 L 389 14 L 385 17" class="arrow" />

    <!-- DECISION (Amber) -->
    <rect x="395" y="0" width="90" height="28" class="flow-box flow-box-amber" />
    <text x="440" y="18" class="flow-text flow-text-amber">DECISION</text>

    <!-- Arrow -->
    <path d="M 491 14 L 519 14 M 515 11 L 519 14 L 515 17" class="arrow" />

    <!-- MONITORING (Cyan) -->
    <rect x="525" y="0" width="100" height="28" class="flow-box flow-box-cyan" />
    <text x="575" y="18" class="flow-text flow-text-cyan">MONITORING</text>
  </g>
</svg>
