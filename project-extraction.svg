<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <style>

      
      .bg { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; rx: 12; }
      
      .text-primary { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1E293B; }
      .text-secondary { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; }
      .text-code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; fill: #475569; }
      
      .accent-teal { fill: #0F766E; }
      .accent-gold { fill: #D97706; }
      
      .panel { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 2; rx: 8; }
      
      /* Messy Raw Data Styling */
      .raw-text-1 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #94A3B8; font-weight: 700; font-size: 16px; text-decoration: line-through; }
      .raw-text-2 { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; fill: #475569; font-weight: 500; font-size: 20px; }
      .raw-text-3 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1E293B; font-weight: 800; font-size: 24px; letter-spacing: -1px; }
      .raw-text-4 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; font-weight: 500; font-size: 18px; font-style: italic; }
      
      /* Clean JSON Styling */
      .json-key { fill: #0F766E; }
      .json-val-str { fill: #D97706; }
      .json-val-num { fill: #0369A1; }
      
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0B1120; stroke: #1E293B; }
        .text-primary { fill: #F8FAFC; }
        .text-secondary { fill: #94A3B8; }
        .text-code { fill: #CBD5E1; }
        .accent-teal { fill: #14B8A6; }
        .accent-gold { fill: #F59E0B; }
        .panel { fill: #0F172A; stroke: #1E293B; }
        
        .raw-text-1 { fill: #475569; }
        .raw-text-2 { fill: #94A3B8; }
        .raw-text-3 { fill: #F8FAFC; }
        .raw-text-4 { fill: #CBD5E1; }
        
        .json-key { fill: #2DD4BF; }
        .json-val-str { fill: #FBBF24; }
        .json-val-num { fill: #38BDF8; }
      }
    </style>
  </defs>

  <!-- Plate Background -->
  <rect x="2" y="2" width="796" height="446" class="bg" />

  <!-- Global Header -->
  <text x="40" y="60" class="text-secondary" font-size="20" font-weight="700" letter-spacing="3">DATA EXTRACTION PIPELINE</text>

  <!-- Left Column: Raw Input -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="280" height="180" class="panel" />
    <text x="25" y="45" class="text-secondary" font-size="18" font-weight="700" letter-spacing="2">RAW ASSETS</text>
    
    <!-- Messy blocks simulating a noisy PDF/Catalogue -->
    <text x="25" y="85" class="raw-text-3">Pump-X200</text>
    <text x="25" y="105" class="raw-text-4">Centrifugal pump</text>
    <text x="25" y="135" class="raw-text-2">Volt: 220V/380V</text>
    <text x="195" y="135" class="raw-text-1">50hz</text>
    <text x="25" y="165" class="raw-text-4">Material: SS304</text>
    <text x="180" y="165" class="raw-text-2">IP65</text>
    <text x="25" y="185" class="raw-text-2">Power: 7,5 kW</text>
  </g>

  <!-- Center Column: Bridge (Extraction Logic) -->
  <g transform="translate(330, 105)">
    <!-- Increased font size to 20px and tightened vertical spacing for mobile readability -->
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700" class="text-secondary" text-anchor="middle">
      <text x="70" y="30">PARSE</text>
      <path d="M 70 40 L 70 50" stroke="#94A3B8" stroke-width="2" />
      <path d="M 65 45 L 70 50 L 75 45" fill="none" stroke="#94A3B8" stroke-width="2" />

      <text x="70" y="75">NORMALISE</text>
      <path d="M 70 85 L 70 95" stroke="#94A3B8" stroke-width="2" />
      <path d="M 65 90 L 70 95 L 75 90" fill="none" stroke="#94A3B8" stroke-width="2" />

      <text x="70" y="120">MAP</text>
      <path d="M 70 130 L 70 140" stroke="#94A3B8" stroke-width="2" />
      <path d="M 65 135 L 70 140 L 75 135" fill="none" stroke="#94A3B8" stroke-width="2" />

      <text x="70" y="165">VALIDATE</text>
    </g>
  </g>

  <!-- Right Column: Structured Output -->
  <g transform="translate(480, 100)">
    <rect x="0" y="0" width="280" height="180" class="panel" />
    <text x="25" y="45" class="text-secondary" font-size="18" font-weight="700" letter-spacing="2">STRUCTURED OUTPUT</text>
    
    <!-- Clean JSON Output -->
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700">
      <text x="25" y="80" class="text-primary">{</text>
      
      <text x="45" y="105" class="json-key">"power_kw"</text>
      <text x="155" y="105" class="text-primary">:</text>
      <text x="175" y="105" class="json-val-num">7.5</text>
      <text x="210" y="105" class="text-primary">,</text>
      
      <text x="45" y="130" class="json-key">"voltage_v"</text>
      <text x="155" y="130" class="text-primary">:</text>
      <text x="175" y="130" class="json-val-num">380</text>
      <text x="210" y="130" class="text-primary">,</text>

      <text x="45" y="155" class="json-key">"material"</text>
      <text x="155" y="155" class="text-primary">:</text>
      <text x="175" y="155" class="json-val-str">"SS304"</text>
      
      <text x="25" y="175" class="text-primary">}</text>
    </g>
    <!-- Honesty constraint tag -->
    <text x="25" y="200" class="text-secondary" font-size="10" font-weight="500" letter-spacing="0" opacity="0.6">* ILLUSTRATIVE TRANSFORMATION</text>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(40, 310)">
    <rect x="0" y="0" width="720" height="100" class="panel" stroke-width="2" />
    
    <g transform="translate(40, 58)">
      <text x="0" y="0" class="text-secondary" font-size="28" font-weight="700" letter-spacing="2">SCHEMA-DRIVEN EXTRACTION</text>
      
      <text x="680" y="-18" class="text-secondary" font-size="16" font-weight="700" letter-spacing="1" text-anchor="end">VERIFIABLE</text>
      <text x="680" y="2" class="text-secondary" font-size="16" font-weight="700" letter-spacing="1" text-anchor="end">OUTPUT</text>
      
      <!-- Replaced 90%+ coverage with verified repo capability -->
      <text x="680" y="42" class="accent-gold" font-size="36" font-weight="800" letter-spacing="0" text-anchor="end">12-PRODUCT DEMO</text>
    </g>
  </g>

</svg>
